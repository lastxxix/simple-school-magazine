version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: journal-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: journal
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/journal.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-file-per-table=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  php:
    build:
      context: .
      dockerfile: Dockerfile-php
    container_name: journal-php
    volumes:
      - ./src:/var/www/html
    ports:
      - "8000:80"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: journal
      DB_USER: user
      DB_PASS: userpassword

volumes:
  mysql_data: